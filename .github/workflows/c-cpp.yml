name: C Monitor-app
working-directory: ./host/

permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make monitor
      run: make monitor
